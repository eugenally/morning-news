name: 굿모닝 브리핑

on:
  schedule:
    # GitHub Actions는 UTC 기준. 한국시간(KST) = UTC + 9시간.
    # 아침 7시(KST) = 전날 22:00(UTC). (GitHub 부하에 따라 몇 분 늦을 수 있음)
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 깃허브에서 수동 실행 버튼도 제공

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install --quiet certifi anthropic

      - name: 브리핑 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python morning_feed.py
