name: 굿모닝 브리핑

on:
  schedule:
    # GitHub Actions는 UTC 기준. 한국시간(KST) = UTC + 9시간.
    # 21:47(UTC) = 다음날 06:47(KST).
    #
    # 왜 정각이 아닌가:
    # 예약 실행은 전 세계 요청이 정각(:00)에 몰려 크게 밀린다.
    # 실제로 "0 22"(=07:00 KST)로 두었을 때 07:56~08:03에 실행됐다.
    # :00 / :15 / :30 / :45 같은 흔한 시각을 피해 :47로 잡고 목표보다
    # 조금 앞당겨, 약간 밀리더라도 7시 전후에 도착하게 한다.
    - cron: "47 21 * * *"
  workflow_dispatch: {}   # 깃허브에서 수동 실행 버튼도 제공

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install --quiet certifi anthropic

      - name: 브리핑 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python morning_feed.py
